[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finresearch"
version = "1.0.0"
description = "Financial Research Toolkit — free, open-source CLI for stock fundamentals (yfinance), SEC EDGAR (insider Form 4, 13F, 13D/G, S-3/424B, buybacks, 8-K events), FTD fails, FINRA short interest, options flow, full-market scanning with saved scan templates, FRED macro, FOMC analysis + market-implied odds, and premarket gappers. JP listings supported."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "finresearch contributors"},
]
keywords = ["finance", "stocks", "sec-edgar", "yfinance", "fundamental-analysis", "insider-trading", "13f", "fred", "fomc", "macro"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=1.4.0",  # dividendYield in percent points + screener API
    "requests>=2.28.0",
    "pandas>=1.5",
    "numpy>=1.23",
    "beautifulsoup4>=4.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "tomli>=2.0; python_version < '3.11'",
]
crawl4ai = [
    "crawl4ai>=0.4.0",
]

[project.scripts]
finresearch = "finresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Policy: meaningful default rule set; documented carve-outs for deliberate idioms.
# BLE001: network/parse guards intentionally swallow upstream flakiness (house idiom).
# DTZ005/DTZ007: FRED/FOMC date handling is day-granular per source; naive datetimes
#   are intentional (all comparisons stay within one source's frame).
# PLW1510: subprocess calls target bundled CLIs whose failure is handled by callers.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = [
    "BLE001",  # network guards are deliberate (see comment above)
    "DTZ005",  # naive datetimes are the domain convention here
    "DTZ007",
    "PLW1510", # subprocess failures handled upstream
    "SIM102",  # collapsible ifs left for readability
    "PLR0124", # x != x NaN checks in formatter edge handling
]

[tool.ruff.lint.per-file-ignores]
# class-level test data tables are intentionally mutable defaults
"tests/*" = ["RUF012"]